name: Ads Pipeline to Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,8,12,16 * * *'

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auth to Google (Sheets API)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SPREADSHEET_IDS: ${{ secrets.SPREADSHEET_IDS }}
          IMAGE_ADS_SOURCE_SPREADSHEET_ID: ${{ secrets.IMAGE_ADS_SOURCE_SPREADSHEET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python load_ads_to_supabase.py
